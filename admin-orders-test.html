<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J Plus Shop V3 | จัดการออเดอร์ (ทดสอบ)</title>
<style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#15304b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#0968b8;color:#fff;padding:18px 22px}h1{font-size:23px;margin:0}header small{opacity:.85}main{max-width:1080px;margin:24px auto;padding:0 14px}.panel{background:#fff;border:1px solid #e0eaf2;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #173a5c0a}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd9e6}input{width:100%;margin:5px 0 12px}button{background:#0968b8;color:white;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e7f1fa;color:#164a70}nav a{display:inline-block;color:#0968b8;margin:4px 12px 4px 0}#notice{white-space:pre-wrap;color:#a43d35}#notice.ok{color:#167448}.order{border-top:1px solid #e4edf4;padding:18px 0}.order:first-child{border-top:0}.top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}.muted{color:#668098;font-size:14px}.money{font-size:20px;font-weight:700;color:#0869b8}.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.status select{max-width:260px}.items{background:#f5f9fc;border-radius:10px;padding:10px 15px;margin-top:12px}.items div{padding:5px 0}.tag{display:inline-block;background:#eaf3ff;border-radius:99px;padding:4px 10px;font-size:13px}#login{max-width:500px}#app{display:none}
</style>
</head>
<body>
<header><h1>📦 J Plus Shop V3 — จัดการออเดอร์</h1><small>หน้าทดสอบสำหรับผู้ดูแลร้านเท่านั้น</small></header>
<main>
<nav><a href="admin.html">จัดการสินค้า</a><a href="admin-shipping.html">ตั้งค่าจัดส่ง</a><a href="index.html">หน้าร้าน</a></nav>
<div id="notice" role="status"></div>
<section class="panel" id="login"><h2>เข้าสู่ระบบ Admin</h2><label>อีเมล<input type="email" id="email" autocomplete="username"></label><label>รหัสผ่าน<input type="password" id="password" autocomplete="current-password"></label><button id="signIn">เข้าสู่ระบบ</button></section>
<section id="app"><div class="panel"><div class="top"><div><h2 style="margin:0">รายการคำสั่งซื้อ</h2><div class="muted" id="summary"></div></div><div><button id="refresh">↻ รีเฟรช</button> <button class="secondary" id="signOut">ออกจากระบบ</button></div></div><p class="muted">สถานะยกเลิกยังไม่เปิดใช้ เพื่อป้องกันสต๊อกคลาดเคลื่อน</p></div><div class="panel" id="orders">กำลังโหลดข้อมูล...</div></section>
</main>
<script src="supabase-config.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), cfg=window.JPLUS_SUPABASE_CONFIG||{};
const base=String(cfg.url||'').replace(/\/$/,''), key=cfg.publishableKey||cfg.anonKey||cfg.anon_key||'';
const STORAGE='jplus_orders_admin_session';let session=null,orders=[];
const statuses={pending:'รอรับออเดอร์',preparing:'กำลังจัดเตรียมสินค้า',shipping:'กำลังจัดส่ง',completed:'จัดส่งสำเร็จ',cancelled:'ยกเลิกคำสั่งซื้อ'};
function notice(message,ok=false){$('notice').textContent=message;$('notice').className=ok?'ok':''}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function baht(n){return '฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateTime(s){if(!s)return '-';let d=new Date(s);return Number.isNaN(d.getTime())?String(s):d.toLocaleString('th-TH')}
async function request(path,{method='GET',body,token=session?.access_token,prefer}={}){
 const h={'apikey':key,'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;if(prefer)h.Prefer=prefer;
 const r=await fetch(base+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 const raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!r.ok)throw Error((data&&typeof data==='object'&&(data.message||data.error_description||data.error))||`HTTP ${r.status}`);
 return data;
}
async function ensureSession(){
 if(!session?.access_token)return false;
 const exp=session.expires_at||0;
 if(exp && Date.now()/1000>exp-60){
  if(!session.refresh_token)return false;
  const s=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token},token:null});
  session={...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in};localStorage.setItem(STORAGE,JSON.stringify(session));
 }
 return true;
}
async function verifyAdmin(){
 const u=await request('/auth/v1/user');
 if(!u?.id)throw Error('ไม่พบข้อมูลผู้ใช้');
 const admins=await request('/rest/v1/shop_admins?select=user_id&user_id=eq.'+encodeURIComponent(u.id)+'&limit=1');
 if(!Array.isArray(admins)||!admins.length)throw Error('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลร้าน');
}
async function start(){
 await ensureSession();await verifyAdmin();$('login').style.display='none';$('app').style.display='block';await loadOrders();
}
async function signIn(){
 $('signIn').disabled=true;notice('กำลังเข้าสู่ระบบ...');
 try{
  if(!base||!key)throw Error('ไม่พบการตั้งค่า Supabase ใน supabase-config.js');
  const s=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:$('email').value.trim(),password:$('password').value},token:null});
  session={...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in};
  await start();localStorage.setItem(STORAGE,JSON.stringify(session));$('password').value='';notice('เข้าสู่ระบบสำเร็จ',true);
 }catch(e){session=null;localStorage.removeItem(STORAGE);notice('เข้าสู่ระบบไม่สำเร็จ: '+e.message)}finally{$('signIn').disabled=false}
}
async function loadOrders(){
 $('refresh').disabled=true;notice('กำลังโหลดออเดอร์...');
 try{
  await ensureSession();
  orders=await request('/rest/v1/shop_orders?select=id,job_no,created_at,customer_name,customer_phone,delivery_method,delivery_address,subtotal,delivery_fee,total_amount,status,shipping_carrier&order=created_at.desc&limit=100');
  const ids=orders.map(o=>o.id);
  let items=[];
  if(ids.length)items=await request('/rest/v1/shop_order_items?select=order_id,product_name,quantity,unit_price,line_total&order_id=in.('+ids.join(',')+')');
  $('summary').textContent=`แสดง ${orders.length} ออเดอร์ล่าสุด`;
  $('orders').innerHTML=orders.length?orders.map(o=>{
   const lines=items.filter(i=>i.order_id===o.id);
   const options=Object.entries(statuses).filter(([k])=>k!=='cancelled'&&(k===o.status||o.status!=='cancelled')).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('');
   const details=lines.length?lines.map(i=>`<div>${escapeHtml(i.product_name)} × ${Number(i.quantity)} — ${baht(i.line_total)}</div>`).join(''):'<div>ไม่พบรายการสินค้า</div>';
   return `<article class="order"><div class="top"><div><strong>เลขงาน ${escapeHtml(o.job_no||o.id)}</strong> <span class="tag">${escapeHtml(statuses[o.status]||o.status||'-')}</span><div class="muted">${escapeHtml(dateTime(o.created_at))}</div></div><div class="money">${baht(o.total_amount)}</div></div><p><strong>ลูกค้า:</strong> ${escapeHtml(o.customer_name)} | ${escapeHtml(o.customer_phone)}<br><strong>วิธีรับ:</strong> ${escapeHtml(o.delivery_method)} | <strong>ที่อยู่:</strong> ${escapeHtml(o.delivery_address||'-')}</p><div class="items">${details}<div class="muted">ค่าส่ง ${baht(o.delivery_fee)} · ค่าสินค้า ${baht(o.subtotal)}</div></div><div class="status"><label for="s${o.id}">สถานะ:</label><select id="s${o.id}" ${o.status==='cancelled'?'disabled':''}>${options}</select><button data-save="${o.id}" ${o.status==='cancelled'?'disabled':''}>บันทึกสถานะ</button></div></article>`;
  }).join(''):'ยังไม่มีออเดอร์';
  notice('โหลดข้อมูลเรียบร้อย',true);
 }catch(e){$('orders').textContent='โหลดข้อมูลไม่ได้';notice('เกิดข้อผิดพลาด: '+e.message+'\nหากขึ้น permission denied ให้ตรวจสิทธิ์ Data API / RLS ก่อน')}
 finally{$('refresh').disabled=false}
}
async function saveStatus(id,button){
 const order=orders.find(o=>o.id===id),next=$('s'+id)?.value;
 if(!order||!next||next==='cancelled'||order.status==='cancelled')return;
 if(next===order.status){notice('สถานะยังไม่เปลี่ยน',true);return}
 if(!confirm(`เปลี่ยนสถานะเลขงาน ${order.job_no||id}\nจาก ${statuses[order.status]||order.status}\nเป็น ${statuses[next]} ใช่ไหม?`))return;
 button.disabled=true;
 try{
  await ensureSession();
  const result=await request('/rest/v1/shop_orders?id=eq.'+encodeURIComponent(id)+'&status=eq.'+encodeURIComponent(order.status),{method:'PATCH',body:{status:next},prefer:'return=representation'});
  if(!Array.isArray(result)||result.length!==1)throw Error('ไม่พบรายการที่อัปเดต อาจมีผู้แก้ไขสถานะไปก่อนแล้ว');
  await loadOrders();notice('บันทึกสถานะเรียบร้อยแล้ว',true);
 }catch(e){notice('บันทึกไม่สำเร็จ: '+e.message);button.disabled=false}
}
$('signIn').onclick=signIn;$('refresh').onclick=loadOrders;
$('signOut').onclick=()=>{session=null;localStorage.removeItem(STORAGE);$('app').style.display='none';$('login').style.display='block';notice('ออกจากระบบแล้ว',true)};
$('orders').addEventListener('click',e=>{const b=e.target.closest('[data-save]');if(b)saveStatus(Number(b.dataset.save),b)});
(async()=>{if(!base||!key){notice('ไม่พบ Supabase URL หรือ public key ใน supabase-config.js');return}try{session=JSON.parse(localStorage.getItem(STORAGE)||'null');if(session)await start()}catch(e){session=null;localStorage.removeItem(STORAGE);notice('กรุณาเข้าสู่ระบบ Admin: '+e.message)}})();
</script>
</body>
</html>
